[project]
name = "prasad-algo"
version = "0.1.0"
description = "Deterministic Multi-Timeframe Algorithmic Trading System"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = true
